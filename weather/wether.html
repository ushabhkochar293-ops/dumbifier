<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
    <link rel="stylesheet" href="./wether.css">
    <link rel="stylesheet" href="https://googlrapis.com">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter your city" id="city" spellcheck="false" >
            <button id="searchbtn"><img src="images/search.png" alt="Search" ></button>
            </div>
            <div class="error">
                <p> Invalid city name</p>
            </div>
            <div class="weather">
                <img src="./images/rain.png" class="weather-icon">
                <h1 class="temparature">25°C</h1>
                <h2 class="city">Mumbai</h2>
                <div class="details">
                    <div class="column">
                        <img src="./images/humidity.png">
                        <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                        </div>

                    </div>
                    <div class="column">
                        <img src="./images/wind.png">
                        <div>
                            <p class="wind">10km/hr</p>
                            <p>Wind speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./wether.js"></script>
</body>
</html>
